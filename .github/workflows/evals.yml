# Eval gate — the merge button's conscience.
# Runs the golden set on every PR; posts the scorecard as a PR comment;
# fails the check on regression. Marked "required" in branch protection,
# so a PR that regresses ground-truth answers physically cannot merge,
# regardless of who — or what — wrote the code.
name: eval-gate
on:
  pull_request:
    branches: [main]

# Scoped PER JOB rather than workflow-wide, on security review at M04. The
# workflow-level block granted `pull-requests: write` and `id-token: write` to
# every job, and `unit` needs neither — it assumes no AWS role and posts no
# comment. Only `golden-set` uses them.
#
# Not a live exposure when it was written: no AWS role trusting this repo exists
# yet, so the id-token was unspendable, and `unit` already ran author-controlled
# Python via pytest under those same permissions. Scoped anyway, because the
# moment a job starts doing more is the moment to check what it was allowed to
# do — and because the grant should sit next to the one step that spends it.
#
# NOTE for anyone editing: a job-level `permissions` block REPLACES the
# workflow-level one rather than merging with it, which is why `golden-set`
# restates all three. Dropping one there silently breaks OIDC or the PR comment.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      # Pinned. Unpinned, the enforced rule set is whatever the latest ruff
      # happens to default to, so identical code passes or fails depending on
      # the day of the pip resolve. Rule selection lives in ruff.toml, also
      # explicit, for the same reason.
      #
      # Moved from inline pins to requirements-dev.txt at M03. The pins were
      # inline and the laptop's were not pinned at all, so they had already
      # drifted — CI ran ruff 0.16.2 against a local 0.16.1 — which defeats the
      # reason for pinning stated above. One file is now the source of truth for
      # both. M03 also adds langgraph, which this step did not install, so the
      # first test importing the graph would have failed the gate here.
      - run: pip install -r requirements-dev.txt
      # `tests` added at M02. It was outside this target, so test code was the
      # one unlinted directory in the repo — and B023 late-binding closures,
      # the rule ruff.toml exists for, are most common in test fixtures.
      # Scoped per-file-ignores for the boto3-mimicking fakes and the
      # deliberate Unicode payloads live in ruff.toml.
      - run: ruff check src evals infra tests
      - run: pytest -q
      # THE INSTRUMENT, not the system. `golden-set` below measures whether
      # RegDelta answers correctly; these measure whether the questions can tell
      # a correct answer from an incorrect one — which the golden set silently
      # could not, for every one of its trap questions, until 2026-08-15.
      #
      # They belong in `unit` rather than `golden-set`: no AWS, no API, no
      # Bedrock, no cost, and nothing to gate them behind. `golden-set` is
      # skipped until EVAL_GATE_ENABLED flips post-M04, so putting them there
      # would mean the check that catches a broken question does not run at all
      # in the window where questions are actively being written.
      #
      # check_discrimination gates on any specimen scoring the wrong way, and
      # also on a question with NO specimens — which is what makes it bite when
      # someone adds question 21, rather than only when they break question 20.
      - run: python evals/check_discrimination.py
      # Replays every answer ever recorded against the questions as they now
      # stand. Reads only evals/history/, so it is deterministic here and needs
      # no network. Catches the failure a single run cannot show: a question
      # that passes on the wording of the day. q05 passed twice and failed the
      # third time on identical tokens, having never once matched the sentence
      # stating its own criteria.
      #
      # It gates on FRAGILE and REGRESSED but NOT on ADMITTED — the latter means
      # "the naive control's own answer satisfies this question", which is a
      # standing SME-seat question about the question set (true of six questions
      # today), not a defect any one PR introduces. Gating on it would fail every
      # PR here until a ruling lands. `--strict` is available for a deliberate
      # audit run; CI deliberately does not use it.
      - run: python evals/replay_history.py

  golden-set:
    runs-on: ubuntu-latest
    # All three restated, NOT inherited. A job-level `permissions` block
    # REPLACES the workflow-level one; it does not merge. The workflow level is
    # now `contents: read` only, so omitting this would leave this job without
    # `id-token` (breaking the OIDC step below) and without `pull-requests:
    # write` (breaking the scorecard comment) — and it would not show up until
    # EVAL_GATE_ENABLED flips, because `if:` skips the job today.
    #
    # That is exactly what happened when the per-job scoping landed: the
    # workflow level was lowered and this block was not added in the same
    # commit. Caught by reading the parsed YAML rather than the diff.
    permissions:
      contents: read
      pull-requests: write
      id-token: write        # OIDC to AWS — no long-lived keys in secrets
    needs: unit
    # Skip until the staging API exists (post-M04). Flip to enabled by
    # setting the repo variable EVAL_GATE_ENABLED=true.
    #
    # EVAL_GATE_ENABLED was set to 'true' on 2026-08-04, before either the
    # staging API (SPEC/04) or the OIDC role existed, so this job failed at
    # configure-aws-credentials. Nobody saw it: `needs: unit` skipped this
    # job on every run, because the lint step below it had never passed. Set
    # back to 'false' on 2026-08-08. DO NOT flip it to 'true' again until
    # BOTH repo variables below are populated — AWS_EVAL_ROLE_ARN and
    # STAGING_API_URL are read unguarded and an empty value fails the job
    # rather than skipping it.
    if: vars.EVAL_GATE_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      # The runtime manifest, not a bare `pip install boto3` — this job talks to
      # the deployed API and must not drift from what that API was built against.
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}   # OIDC role, read-only + invoke
          aws-region: us-east-1
      - name: Run golden set vs staging
        id: evals
        env:
          REGDELTA_API_URL: ${{ vars.STAGING_API_URL }}
        # NO PIPE. `python ... | tee` made `$?` the exit status of TEE, which
        # always succeeds, so this step reported exit=0 no matter how many
        # golden questions failed and the header's claim above was false. The
        # job sets no `shell:`, so the default is `bash -e {0}` — which does
        # NOT include pipefail. `set -o pipefail` would fix that one line and
        # leave `set +e` disarming everything else in the step, including the
        # $GITHUB_OUTPUT write that Enforce depends on. So: keep -e armed and
        # exempt only the one command that is EXPECTED to fail.
        run: |
          set -uo pipefail
          rc=0
          python evals/run_evals.py > scorecard.txt 2>&1 || rc=$?
          cat scorecard.txt
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Post scorecard on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = "### 🧪 Eval gate — golden set\n```\n" +
              fs.readFileSync('scorecard.txt','utf8').slice(-3000) + "\n```" +
              "\n_Ground truth owned by @regdelta-sme (CODEOWNERS). " +
              "A failing gate blocks merge by branch protection._";
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body });
      # `if: always()` because on a fork PR the comment step above fails —
      # `pull_request` hands out a read-only token regardless of `permissions:`
      # — and without it a failed comment would SKIP enforcement entirely.
      #
      # The empty check is the second fail-open path: `exit ${{ ... }}` renders
      # to a bare `exit` if the eval step died before writing its output (OOM,
      # missing interpreter, a renamed step id), and bare `exit` returns the
      # status of the previous command: 0. A gate that passes because its own
      # measurement crashed is the same defect with a different trigger.
      #
      # Read through `env:` rather than interpolated into the shell, so the
      # template value is never parsed as script.
      - name: Enforce
        if: always()
        env:
          EVAL_RC: ${{ steps.evals.outputs.exit }}
        run: |
          if [ -z "$EVAL_RC" ]; then
            echo "the eval step recorded no exit code — failing closed" >&2
            exit 1
          fi
          exit "$EVAL_RC"
