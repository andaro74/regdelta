# Eval gate — the merge button's conscience.
# Runs the golden set on every PR; posts the scorecard as a PR comment;
# fails the check on regression.
#
# `golden-set` IS A REQUIRED CHECK, AND WHEN IT RUNS AND FAILS THE MERGE IS
# REFUSED. Measured 2026-08-22 on PR #17, not asserted: golden-set FAILURE with
# `unit` and `ruling-cited` both SUCCESS gave mergeStateStatus BLOCKED
# (milestones/M07/eval-gate-live.txt).
#
# THE SENTENCE STOPS THERE, and the missing half is the point. A SKIPPED
# required check reads CLEAN and does NOT block — also measured, on PR #16
# (milestones/M07/skipped-check.txt). This job skips on fork pull requests and
# whenever EVAL_GATE_ENABLED is false, and on those pull requests it is not a
# gate at all. "Regresses ground-truth answers physically cannot merge" was the
# old wording and it is still wrong, because it is silent about when this job
# does not run.
#
# WHAT THIS HEADER USED TO CLAIM, AND WHY IT NO LONGER DOES. It said
# `golden-set` is 'marked "required" in branch protection, so a PR that
# regresses ground-truth answers physically cannot merge'. The live ruleset
# required exactly one check — `unit` — with zero approvals and an admin
# bypass of "always" (milestones/M07/baseline/ruleset-20392406.json). So the
# sentence was false for as long as it has been here, and flipping
# EVAL_GATE_ENABLED does not make it true: it produces a gate that COMMENTS
# and does not GATE. security-reviewer, M07 M4.
#
# SPEC/07 item 1 requires the eval gate to be a required check, so M07 adds
# `golden-set` to the ruleset in the same change that flips the flag — by the
# BARE JOB NAME, `golden-set` and not `eval-gate / golden-set`, which is
# ADR-0005's finding and a debt owed since M04. This header gets its sentence
# back when that lands and is verified, and not before.
#
# LANDED 2026-08-22, and the sentence came back at the TOP of this file once it
# had been exercised — not when the ruleset changed. Adding `golden-set` to the
# ruleset changed nothing on its own: with the flag false this job SKIPS, and a
# SKIPPED required check reads CLEAN and does not block — measured on PR #16
# (milestones/M07/skipped-check.txt). "Required" and "gating" are different
# properties and this repo has now paid to learn the difference twice.
#
# TWO CONDITIONS make the claim true, and they are both about this job RUNNING
# rather than about the ruleset: `EVAL_GATE_ENABLED` must be true, and the run
# must be one where the `if:` below does not skip. Both held on PR #17, the job
# failed 18/20, and the merge was refused.
#
# THE FORK CLAUSE IS PERMANENTLY ONE OF THOSE SKIPS. A fork PR skips this job
# and therefore reads CLEAN with no eval gate having run. The clause is still
# right — see its own note below — but whatever sentence goes back in this
# header must not describe `golden-set` as gating fork pull requests, because
# it does not and cannot.
name: eval-gate
on:
  pull_request:
    branches: [main]

# Scoped PER JOB rather than workflow-wide, on security review at M04. The
# workflow-level block granted `pull-requests: write` and `id-token: write` to
# every job, and `unit` needs neither — it assumes no AWS role and posts no
# comment. Only `golden-set` uses them.
#
# Not a live exposure when it was written: no AWS role trusting this repo exists
# yet, so the id-token was unspendable, and `unit` already ran author-controlled
# Python via pytest under those same permissions. Scoped anyway, because the
# moment a job starts doing more is the moment to check what it was allowed to
# do — and because the grant should sit next to the one step that spends it.
#
# NOTE for anyone editing: a job-level `permissions` block REPLACES the
# workflow-level one rather than merging with it, which is why `golden-set`
# restates all three. Dropping one there silently breaks OIDC or the PR comment.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    # DO NOT WIDEN THIS. No `id-token: write`, no `pull-requests: write`, no
    # secrets — and the reason changed at M04, so it is worth restating rather
    # than inheriting.
    #
    # This job now installs aws-cdk-lib, without which
    # tests/test_search_stack_access.py skipped in CI while passing locally
    # (713 tests against 733) — including every AOSS data-access-policy test.
    # Importing aws_cdk STARTS A NODE CHILD PROCESS and the install carries
    # tens of MB of vendored third-party JavaScript, executed on every PR
    # including forks. That is acceptable only because this job holds
    # `contents: read`, assumes no AWS role and sees no secrets: a hostile
    # transitive gets a read-only token and nothing else.
    #
    # The comment at the top of this file says the moment a job starts doing
    # more is the moment to re-check what it is allowed to do. This was that
    # moment; the scoping already covered it. security-reviewer L5, M04.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      # Pinned. Unpinned, the enforced rule set is whatever the latest ruff
      # happens to default to, so identical code passes or fails depending on
      # the day of the pip resolve. Rule selection lives in ruff.toml, also
      # explicit, for the same reason.
      #
      # Moved from inline pins to requirements-dev.txt at M03. The pins were
      # inline and the laptop's were not pinned at all, so they had already
      # drifted — CI ran ruff 0.16.2 against a local 0.16.1 — which defeats the
      # reason for pinning stated above. One file is now the source of truth for
      # both. M03 also adds langgraph, which this step did not install, so the
      # first test importing the graph would have failed the gate here.
      - run: pip install -r requirements-dev.txt
      # `tests` added at M02. It was outside this target, so test code was the
      # one unlinted directory in the repo — and B023 late-binding closures,
      # the rule ruff.toml exists for, are most common in test fixtures.
      # Scoped per-file-ignores for the boto3-mimicking fakes and the
      # deliberate Unicode payloads live in ruff.toml.
      - run: ruff check src evals infra tests
      - run: pytest -q
      # THE INSTRUMENT, not the system. `golden-set` below measures whether
      # RegDelta answers correctly; these measure whether the questions can tell
      # a correct answer from an incorrect one — which the golden set silently
      # could not, for every one of its trap questions, until 2026-08-15.
      #
      # They belong in `unit` rather than `golden-set`: no AWS, no API, no
      # Bedrock, no cost, and nothing to gate them behind. `golden-set` is
      # skipped until EVAL_GATE_ENABLED flips post-M04, so putting them there
      # would mean the check that catches a broken question does not run at all
      # in the window where questions are actively being written.
      #
      # check_discrimination gates on any specimen scoring the wrong way, and
      # also on a question with NO specimens — which is what makes it bite when
      # someone adds question 21, rather than only when they break question 20.
      - run: python evals/check_discrimination.py
      # Replays every answer ever recorded against the questions as they now
      # stand. Reads only evals/history/, so it is deterministic here and needs
      # no network. Catches the failure a single run cannot show: a question
      # that passes on the wording of the day. q05 passed twice and failed the
      # third time on identical tokens, having never once matched the sentence
      # stating its own criteria.
      #
      # It gates on FRAGILE and REGRESSED but NOT on ADMITTED — the latter means
      # "the naive control's own answer satisfies this question", which is a
      # standing SME-seat question about the question set (true of six questions
      # today), not a defect any one PR introduces. Gating on it would fail every
      # PR here until a ruling lands. `--strict` is available for a deliberate
      # audit run; CI deliberately does not use it.
      - run: python evals/replay_history.py

  golden-set:
    runs-on: ubuntu-latest
    # All three restated, NOT inherited. A job-level `permissions` block
    # REPLACES the workflow-level one; it does not merge. The workflow level is
    # now `contents: read` only, so omitting this would leave this job without
    # `id-token` (breaking the OIDC step below) and without `pull-requests:
    # write` (breaking the scorecard comment) — and it would not show up until
    # EVAL_GATE_ENABLED flips, because `if:` skips the job today.
    #
    # That is exactly what happened when the per-job scoping landed: the
    # workflow level was lowered and this block was not added in the same
    # commit. Caught by reading the parsed YAML rather than the diff.
    #
    # THE GUARD DECLINED HERE ON 2026-08-16 NOW EXISTS:
    # tests/test_eval_gate_workflow.py. Its reversal condition was "when
    # EVAL_GATE_ENABLED goes true … add the guard then, in the same change that
    # flips the flag", and M07 is that change.
    #
    # The other half of the declining reason was simply WRONG, and it is worth
    # leaving on the record rather than deleting. It read: "PyYAML is not
    # transitive from boto3, langgraph, fastapi, starlette, mangum or ruff, so
    # it would have had to become a dependency." It is transitive —
    # `langgraph -> langchain-core -> pyyaml<7.0.0,>=5.3.0` — and had already
    # been installed in CI by this very job for as long as langgraph has been in
    # requirements.txt. A cost was asserted, never checked, and used to decline
    # a control. It is pinned explicitly now (requirements-dev.txt), because
    # being transitive is a property of one week's resolve.
    permissions:
      contents: read
      pull-requests: write
      id-token: write        # OIDC to AWS — no long-lived keys in secrets
    needs: unit
    # Skip until the staging API exists (post-M04). Flip to enabled by
    # setting the repo variable EVAL_GATE_ENABLED=true.
    #
    # EVAL_GATE_ENABLED was set to 'true' on 2026-08-04, before either the
    # staging API (SPEC/04) or the OIDC role existed, so this job failed at
    # configure-aws-credentials. Nobody saw it: `needs: unit` skipped this
    # job on every run, because the lint step below it had never passed. Set
    # back to 'false' on 2026-08-08. DO NOT flip it to 'true' again until
    # BOTH repo variables below are populated — AWS_EVAL_ROLE_ARN and
    # STAGING_API_URL are read unguarded and an empty value fails the job
    # rather than skipping it.
    # THE FORK CLAUSE IS NOT BELT-AND-BRACES, it is the boundary stated in the
    # file that owns it. Without it this job runs on a fork PR, and the OIDC
    # trust policy cannot tell a fork from an owner PR: the `sub` claim is
    # `repo:andaro74/regdelta:pull_request` for both, because GitHub's token
    # carries no fork claim. What actually isolates a fork today is that
    # fork-PR token permissions cap at read and `id-token` has no read level,
    # so it resolves to `none` and configure-aws-credentials cannot mint a
    # token. That is real, and it is PLATFORM behaviour rather than anything
    # configured here — invisible to a reader of this repo.
    #
    # It is also an operational fix. Without the clause an outside
    # contributor's PR carries a permanently red `golden-set` reading
    # "Credentials could not be loaded" — not their fault, not fixable by
    # them, and a misleading cause. With it, the job skips and says why.
    # security-reviewer, M07 M3.
    if: >-
      vars.EVAL_GATE_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      # The runtime manifest, not a bare `pip install boto3` — this job talks to
      # the deployed API and must not drift from what that API was built against.
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EVAL_ROLE_ARN }}   # OIDC role, read-only
          # WAS us-east-1, AGAINST A us-west-2 STACK. Nothing had ever run this
          # job — `if: vars.EVAL_GATE_ENABLED` has been false since 2026-08-08 —
          # so the mismatch sat here unexercised, which is this file's own
          # recurring lesson.
          #
          # It is not cosmetic. This step EXPORTS AWS_REGION, and
          # shared/config.py:5 reads `os.environ.get("AWS_REGION", "us-west-2")`
          # — so the default that makes everything else work would have been
          # overridden by the wrong value, and every boto3 client in the job
          # would have looked in an empty region. The corpus fingerprint's
          # `table.scan` is the one that matters: it fails, `fingerprint()`
          # swallows it (`except Exception` by design, see its docstring), and
          # the scorecard posts `corpus: {"available": false}` while looking
          # entirely healthy.
          aws-region: us-west-2
      - name: Run golden set vs staging
        id: evals
        env:
          REGDELTA_API_URL: ${{ secrets.STAGING_API_URL }}
          # WITHOUT THIS THE POSTED SCORECARD IS CORPUS-BLIND, and blind in the
          # silent direction. `shared.corpus.fingerprint()` returns
          # `{"available": false, "reason": "REGISTRY_TABLE unset"}` and the card
          # carries that instead of a documents_sha.
          #
          # That fingerprint is the field that ruled corpus drift in or out in
          # one line when q03 regressed during the M05 window, and M05 recorded
          # against itself that the one card where q03 first failed was the one
          # recorded without the environment resolved. A merge gate posting a
          # comment on every PR is exactly where that must not happen.
          #
          # A table NAME, not a secret — but see the note on AWS_EVAL_ROLE_ARN
          # in docs/governance/branch-protection.md about what a `vars` value
          # does and does not hide on a public repo.
          REGISTRY_TABLE: ${{ vars.REGISTRY_TABLE }}
        # NO PIPE. `python ... | tee` made `$?` the exit status of TEE, which
        # always succeeds, so this step reported exit=0 no matter how many
        # golden questions failed and the header's claim above was false. The
        # job sets no `shell:`, so the default is `bash -e {0}` — which does
        # NOT include pipefail. `set -o pipefail` would fix that one line and
        # leave `set +e` disarming everything else in the step, including the
        # $GITHUB_OUTPUT write that Enforce depends on. So: keep -e armed and
        # exempt only the one command that is EXPECTED to fail.
        run: |
          set -uo pipefail
          rc=0
          python evals/run_evals.py > scorecard.txt 2>&1 || rc=$?
          cat scorecard.txt
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      # THE WHOLE CARD, SURVIVING THE COMMENT'S TRUNCATION. M07 ruling item 4.
      #
      # The PR comment posts `scorecard.txt.slice(-3000)` — the LAST 3,000
      # characters — so the run summary always survives and the per-question
      # evidence above it may not. That is the right trade for the comment and
      # the wrong one for an investigation: on 2026-09-03 the q18 failure had to
      # be reproduced with three live Bedrock calls because the answer existed
      # nowhere after the job ended.
      #
      # `if: always()` because the artifact is worth most on the runs that
      # FAILED, and the eval step is the one allowed to fail here.
      - name: Keep the full scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ github.event.pull_request.head.sha }}
          path: scorecard.txt
          retention-days: 30
      - name: Post scorecard on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // FENCED WITH TILDES, NOT BACKTICKS. scorecard.txt holds model
            // answers derived from Federal Register / eCFR text this repo does
            // not control, and a backtick fence occurring inside an answer
            // escapes a backtick fence and renders as markdown in a comment
            // posted with `pull-requests: write`.
            //
            // Not a script injection, and the distinction matters: the file is
            // read with readFileSync at runtime and never interpolated through
            // an Actions expression, so the EVAL_RC lesson below was applied
            // correctly here. The exposure is what a rendered PR comment can do
            // to the humans and agents reading the thread.
            //
            // NOTE FOR ANYONE EDITING THIS BLOCK: a `script:` body is a YAML
            // VALUE, not a YAML comment, so Actions expression syntax written
            // here — even inside a // JavaScript comment — is parsed and
            // evaluated. An empty one is a workflow syntax error. That is why
            // the sentence above spells the name out instead of showing it.
            // security-reviewer, M07 L4.
            const body = "### 🧪 Eval gate — golden set\n~~~~\n" +
              fs.readFileSync('scorecard.txt','utf8').slice(-3000) + "\n~~~~" +
              // WAS "Ground truth owned by @regdelta-sme (CODEOWNERS)",
              // and CODEOWNERS is not what owns it.
              // required_approving_review_count is 0 and
              // require_code_owner_review is false on this repo's ruleset:
              // CODEOWNERS ROUTES a review request, it does not require one
              // (ADR-0005). What actually refuses an unruled ground-truth
              // change is the ruling-cited check. A footer posted on every
              // scorecard is the worst place to repeat a claim this repo
              // has already measured as false.
              "\n_Ground truth is SME-seat owned: a pull request changing " +
              "it fails the ruling-cited check unless it cites a ruling " +
              "already on main. A REGRESSION here blocks the merge; a " +
              "question that has never passed is reported, not gated " +
              "(milestones/M07/eval-gate-bar-ruling.md)._";
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body });
      # `if: always()` because on a fork PR the comment step above fails —
      # `pull_request` hands out a read-only token regardless of `permissions:`
      # — and without it a failed comment would SKIP enforcement entirely.
      #
      # The empty check is the second fail-open path: `exit ${{ ... }}` renders
      # to a bare `exit` if the eval step died before writing its output (OOM,
      # missing interpreter, a renamed step id), and bare `exit` returns the
      # status of the previous command: 0. A gate that passes because its own
      # measurement crashed is the same defect with a different trigger.
      #
      # Read through `env:` rather than interpolated into the shell, so the
      # template value is never parsed as script.
      - name: Enforce
        if: always()
        env:
          EVAL_RC: ${{ steps.evals.outputs.exit }}
        run: |
          if [ -z "$EVAL_RC" ]; then
            echo "the eval step recorded no exit code — failing closed" >&2
            exit 1
          fi
          exit "$EVAL_RC"
