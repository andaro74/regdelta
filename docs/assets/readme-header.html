<!doctype html>
<!--
  Source for docs/assets/readme-header.png (the README hero image).

  Rendered, not hand-exported, so it can be reproduced:

    chrome --headless=new --disable-gpu --screenshot=readme-header.png       --window-size=1200,630 --force-device-scale-factor=2       file:///.../docs/assets/readme-header.html

  Style follows the floresinnovations.com cover (navy #0c1930-#101f36,
  amber #f0a43a, mono kickers, dashed boundary box). Phrasing rules from
  CLAUDE.md apply to the image too: "two tiers, one algorithm" -- never
  "hybrid", never "faster" -- and the score reads 18/20, not a rounded 20.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(1100px 700px at 78% 18%, #18294a 0%, rgba(24,41,74,0) 55%),
      linear-gradient(135deg, #0c1930 0%, #0e1e38 55%, #101f36 100%);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #eef2f8;
    position: relative;
  }
  .mono { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }

  .plus { position: absolute; color: #2c3d5c; font-size: 22px; font-weight: 300; }

  .left { position: absolute; left: 76px; top: 112px; width: 500px; }
  .kicker { font-size: 15px; letter-spacing: 6px; color: #8b9bb4; }
  .kicker .dot { color: #f0a43a; margin-right: 10px; font-size: 13px; }
  h1 { font-size: 86px; line-height: 1.02; font-weight: 700; color: #f4f7fb; margin-top: 20px; letter-spacing: -1px; }
  .rule { width: 44px; height: 3px; background: #f0a43a; margin: 28px 0 26px 4px; }
  .tag { font-size: 24px; line-height: 1.45; color: #b9c6da; font-weight: 400; width: 450px; }
  .tag b { color: #e8edf5; font-weight: 600; }
  .built { margin-top: 42px; }
  .built .label { font-size: 12px; letter-spacing: 4px; color: #667799; }
  .built .stack { font-size: 17px; color: #dde5f0; margin-top: 10px; }
  .built .sub { font-size: 13px; color: #8b9bb4; margin-top: 8px; }
  .site { position: absolute; left: 76px; bottom: 44px; font-size: 14px; color: #667799; letter-spacing: 2px; }

  .diagram { position: absolute; right: 44px; top: 24px; }
</style>
</head>
<body>
  <div class="plus" style="left:46px; top:36px;">+</div>
  <div class="plus" style="right:46px; top:36px;">+</div>
  <div class="plus" style="left:46px; bottom:30px;">+</div>
  <div class="plus" style="right:46px; bottom:30px;">+</div>

  <div class="left">

    <h1>RegDelta</h1>
    <div class="rule"></div>
    <div class="tag">What changed, does it apply to us, and what&rsquo;s the real deadline &mdash; <b>with a citation on every claim.</b></div>
    <div class="built">

    </div>
  </div>

    <text x="134" y="216" fill="#f4f7fb" font-family="Cascadia Mono,Consolas,monospace" font-size="17" font-weight="bold" letter-spacing="2">AGENT</text>

    <path d="M404 220 C 424 220 418 166 438 166" stroke="#4a5f80" stroke-width="1.5" fill="none"/>

      <text x="486" y="179" text-anchor="middle" fill="#8b9bb4" font-size="10">always-on</text>

      <rect x="438" y="250" width="96" height="48" rx="8" fill="#13233d" stroke="#3a4d6b" stroke-width="1.5"/>
      <text x="486" y="271" text-anchor="middle" fill="#eef2f8" font-size="12">amendment</text>
      <text x="486" y="287" text-anchor="middle" fill="#8b9bb4" font-size="10">graph</text>
    </g>

    <!-- arrow down from agent -->
    <line x1="175" y1="264" x2="175" y2="316" stroke="#4a5f80" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- guard nodes under the agent -->
    <g font-family="Cascadia Mono,Consolas,monospace">
      <rect x="62" y="322" width="226" height="52" rx="8" fill="#13233d" stroke="#3a4d6b" stroke-width="1.5"/>
      <path d="M92 336 l9 4 v8 c0 6 -4 10 -9 12 c-5 -2 -9 -6 -9 -12 v-8 z" fill="none" stroke="#9fb0c8" stroke-width="1.5"/>
      <text x="112" y="352" fill="#dde5f0" font-size="12.5">human review &#183; conf &lt; 0.7</text>

      <line x1="175" y1="374" x2="175" y2="408" stroke="#4a5f80" stroke-width="1.5" marker-end="url(#arr)"/>

      <rect x="62" y="414" width="226" height="52" rx="8" fill="#13233d" stroke="#3a4d6b" stroke-width="1.5"/>
      <line x1="88" y1="452" x2="88" y2="436" stroke="#9fb0c8" stroke-width="2"/>
      <line x1="95" y1="452" x2="95" y2="428" stroke="#9fb0c8" stroke-width="2"/>
      <line x1="102" y1="452" x2="102" y2="442" stroke="#9fb0c8" stroke-width="2"/>
      <text x="116" y="444" fill="#dde5f0" font-size="12.5">golden set &#183; 18/20 gated</text>
    </g>

    <!-- answer node, amber-tinged, at the bottom of the flow -->
    <line x1="175" y1="466" x2="175" y2="498" stroke="#4a5f80" stroke-width="1.5" marker-end="url(#arr)"/>
    <g font-family="Cascadia Mono,Consolas,monospace">

      <text x="175" y="520" text-anchor="middle" fill="#f0c37a" font-size="12" letter-spacing="1">FR doc &#183; CFR &#183; deadline</text>
    </g>

    <!-- corner note -->
    <text x="514" y="530" text-anchor="end" font-family="Cascadia Mono,Consolas,monospace" font-size="11" fill="#8b9bb4"><tspan fill="#f0a43a">&#9679;</tspan>&#160;&#160;two tiers &#183; one algorithm</text>
  </svg>
</body>
</html>
