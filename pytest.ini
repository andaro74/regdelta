[pytest]
# WHERE THE TESTS ARE, so `pytest -q` cannot wander into build output.
#
# Added at M04 after the dependency layer landed. `make layer` installs ~3,600
# files of third-party wheels, CDK stages a copy of them under
# infra/cdk.out/asset.*/python/, and a bare `pytest -q` from the repo root
# collected the vendored packages' OWN test files — certifi/tests/test_certify.py,
# annotated_types/test_cases.py.
#
# The second-order failure is the one that cost the time. Collecting a file
# under .../asset.*/python/ puts that directory on sys.path, and it holds
# MANYLINUX wheels built for the Lambda runtime — so the local suite then
# imported a linux ormsgpack and three graph tests died with
# "No module named 'ormsgpack.ormsgpack'", which reads like a broken local
# environment and is nothing of the kind.
#
# testpaths rather than norecursedirs: an allowlist of one directory cannot be
# outflanked by the next build artifact someone adds, and this repo has just
# spent a milestone on the difference between the two.
testpaths = tests

# The repo's own tests import from src/ the way Lambda does (tests/conftest.py),
# and importing a vendored copy of anything would defeat that.
norecursedirs = .git .venv build infra/cdk.out node_modules
